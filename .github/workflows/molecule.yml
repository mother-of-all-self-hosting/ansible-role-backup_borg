---
name: molecule

on:  # yamllint disable-line rule:truthy
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  workflow_dispatch:

jobs:
  published-images:
    name: Check published Borg/borgmatic images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Check every supported image tag
        shell: bash
        run: |
          set -euo pipefail
          pair="$(sed -nE 's/^backup_borg_image_version: ([0-9]+\.[0-9]+\.[0-9]+-[0-9]+\.[0-9]+\.[0-9]+)$/\1/p' defaults/main.yml)"
          if [ -z "$pair" ]; then
            echo 'Could not read backup_borg_image_version from defaults/main.yml' >&2
            exit 1
          fi
          postgres_versions="$(python3 - <<'PYTHON'
          import ast
          from pathlib import Path

          lines = Path('defaults/main.yml').read_text().splitlines()
          key = 'backup_borg_supported_postgres_versions:'
          values = [line.partition(':')[2].strip() for line in lines if line.startswith(key)]
          if len(values) != 1:
              raise SystemExit('Expected one supported Postgres version list')
          versions = ast.literal_eval(values[0])
          if not isinstance(versions, list) or not versions or not all(isinstance(v, str) and v.isdecimal() for v in versions):
              raise SystemExit('Invalid supported Postgres version list')
          print(' '.join(versions))
          PYTHON
          )"
          for postgres in $postgres_versions; do
            image="ghcr.io/etkecc/borgmatic:${postgres}-${pair}"
            echo "Checking $image"
            docker manifest inspect "$image" >/dev/null
          done

  molecule:
    name: Run Molecule scenario '${{ matrix.scenario }}' on ${{ matrix.distro }}
    needs: published-images
    runs-on: ubuntu-latest

    # Same-repository pull requests already run via the push event;
    # run pull_request jobs only for pull requests from forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      matrix:
        distro:
          - ubuntu2604
        scenario:
          - default
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          path: backup_borg

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: backup_borg/.python-version
          cache: pip
          cache-dependency-path: backup_borg/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: backup_borg
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('backup_borg/molecule/*/requirements.yml') }}

      - name: Run Molecule
        working-directory: backup_borg
        run: molecule test --scenario-name ${{ matrix.scenario }}
